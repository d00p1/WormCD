services:
  web:
    # CI rewrites this digest when it pushes a new image; production never
    # tracks a mutable tag.
    image: ghcr.io/d00p1/wormcd-demo@sha256:7997168d40c8fec645c16397bacd6fddf914517420590f3aa5e4cb09a135b45a
    environment:
      APP_ENV: prod
      LOG_LEVEL: warn
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

secrets:
  # Top-level maps merge by key, so the same compose key points at a
  # different external secret per environment.
  tls_key:
    name: prod_tls_key
