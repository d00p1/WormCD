services:
  web:
    image: ghcr.io/d00p1/web:v1
    command: ["/app/server", "--verbose"]
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
    ports:
      - "8080:80"
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    secrets:
      - source: tls_key
        target: /run/secrets/tls.key
    volumes:
      - data:/var/lib/web
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 2s
      retries: 3

  worker:
    image: ghcr.io/d00p1/worker:v1
    environment:
      APP_ENV: staging
    networks:
      - backend

networks:
  backend:
    driver: overlay

volumes:
  data:

configs:
  nginx:
    file: ./configs/nginx.conf

secrets:
  tls_key:
    external: true
    name: prod_tls_key
